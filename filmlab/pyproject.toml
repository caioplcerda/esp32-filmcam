[project]
name = "filmlab"
version = "0.1.0"
description = "Film emulation pipeline for ESP32-CAM stills"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "opencv-python>=4.10",
    "scipy>=1.14",
    "tifffile>=2024.8.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
filmlab = "filmlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filmlab = ["stock_data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=filmlab --cov-report=term-missing"
